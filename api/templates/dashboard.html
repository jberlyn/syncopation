{{template "base" .}}

{{define "content"}}
<header class="nav-header">
    <div class="logo">Joplin Sync Server Admin</div>
    <nav>
        <span>{{.User.Email}}</span>
        <a href="/admin/logout">Sign out</a>
    </nav>
</header>

<main>
    <div class="card" style="margin-bottom: 2rem;">
        <h2>Dashboard Statistics</h2>
        <div style="display: flex; gap: 2rem; margin-top: 1rem;">
            <div style="padding: 1rem; background: var(--surface); border: 1px solid var(--border-color); border-radius: 8px; flex: 1;">
                <h3 style="margin-bottom: 0.5rem; color: var(--text-muted);">Total Users</h3>
                <p style="font-size: 2rem; font-weight: bold; margin: 0;">{{.Stats.TotalUsers}}</p>
            </div>
            <div style="padding: 1rem; background: var(--surface); border: 1px solid var(--border-color); border-radius: 8px; flex: 1;">
                <h3 style="margin-bottom: 0.5rem; color: var(--text-muted);">Total Sync Items</h3>
                <p style="font-size: 2rem; font-weight: bold; margin: 0;">{{.Stats.TotalItems}}</p>
            </div>
        </div>
    </div>

    <div class="card">
        <h2>User Management</h2>
        
        <form hx-post="/admin/users" hx-target="#user-list" hx-swap="outerHTML" style="margin-top: 1.5rem; margin-bottom: 2rem; display: flex; gap: 1rem; align-items: flex-end;">
            <div class="form-group" style="margin-bottom: 0; flex: 1;">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group" style="margin-bottom: 0; flex: 1;">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div style="margin-bottom: 0;">
                <button type="submit" style="width: auto; padding-left: 1.5rem; padding-right: 1.5rem;">Add User</button>
            </div>
        </form>

        {{template "user-list" .}}
    </div>
</main>
{{end}}
