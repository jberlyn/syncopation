{{define "logo"}}
<svg class="app-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 120" width="100%" height="100%" style="background: transparent; max-height: 100%;">
  <defs>
    <!-- Accent Gradient for the subtle sync element -->
    <linearGradient id="syncGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
  </defs>

  <g transform="translate(10, 15)">
    <!-- Custom 'S' styled as an interconnected sync loop -->
    <path d="M 45 32 
             C 45 20, 20 20, 20 35 
             C 20 55, 50 45, 50 65 
             C 50 80, 25 80, 20 68" 
          fill="none" 
          stroke="url(#syncGrad)" 
          stroke-width="9" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Sync indicator nodes on the 'S' -->
    <circle cx="45" cy="32" r="4.5" fill="#3B82F6" />
    <circle cx="20" cy="68" r="4.5" fill="#1D4ED8" />

    <!-- Wordmark: SYNCOPATION -->
    <text x="65" y="62" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="46" 
          font-weight="700" 
          letter-spacing="4" 
          fill="currentColor">
      YNCOPAT<tspan fill="#3B82F6">I</tspan>ON
    </text>
  </g>
</svg>
{{end}}
