{{define "stats"}}
<div id="dashboard-stats" {{if .OOB}}hx-swap-oob="true"{{end}} style="display: flex; gap: 2rem; margin-top: 1rem;">
    <div style="padding: 1rem; background: var(--surface); border: 1px solid var(--border-color); border-radius: 8px; flex: 1;">
        <h3 style="margin-bottom: 0.5rem; color: var(--text-muted);">Users</h3>
        <p style="font-size: 2rem; font-weight: bold; margin: 0;">{{.Stats.TotalUsers}}</p>
    </div>
    <div style="padding: 1rem; background: var(--surface); border: 1px solid var(--border-color); border-radius: 8px; flex: 1;">
        <h3 style="margin-bottom: 0.5rem; color: var(--text-muted);">Synced Items</h3>
        <p style="font-size: 2rem; font-weight: bold; margin: 0;">{{.Stats.TotalItems}}</p>
    </div>
</div>
{{end}}
