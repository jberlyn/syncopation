{{define "user-list"}}
<div id="user-list" {{if .OOB}}hx-swap-oob="true"{{end}}>
    <table style="width: 100%; border-collapse: collapse; text-align: left;">
        <thead>
            <tr style="border-bottom: 1px solid var(--border-color);">
                <th style="padding: 0.75rem 0;">Email</th>
                <th style="padding: 0.75rem 0;">Role</th>
                <th style="padding: 0.75rem 0;">Items</th>
                <th style="padding: 0.75rem 0;">Actions</th>
            </tr>
        </thead>
        <tbody>
            {{range .UserStats}}
            <tr style="border-bottom: 1px solid var(--border-color);">
                <td style="padding: 0.75rem 0;">{{.Email}}</td>
                <td style="padding: 0.75rem 0;">{{if eq .IsAdmin 1}}Admin{{else}}User{{end}}</td>
                <td style="padding: 0.75rem 0;">{{.TotalItems}}</td>
                <td style="padding: 0.75rem 0;">
                    {{if ne .IsAdmin 1}}
                    <button class="delete-btn" style="background: var(--error); color: white; padding: 0.25rem 0.5rem; font-size: 0.875rem; border: none; border-radius: 4px; cursor: pointer; display: inline-block; width: auto;" 
                            hx-delete="/users/{{.UserID}}" 
                            hx-target="#user-list" 
                            hx-swap="outerHTML"
                            hx-confirm="Are you sure you want to delete this user?">
                        <span class="btn-text">Delete</span>
                        <span class="htmx-indicator" style="display: none;">Wait...</span>
                    </button>
                    {{end}}
                </td>
            </tr>
            {{end}}
        </tbody>
    </table>
    <style>
        .delete-btn.htmx-request .btn-text { display: none; }
        .delete-btn.htmx-request .htmx-indicator { display: inline; }
        .delete-btn.htmx-request { opacity: 0.7; pointer-events: none; }
    </style>
</div>
{{end}}
