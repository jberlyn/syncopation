{{template "base" .}}

{{define "content"}}
<div class="container">
    <div class="card">
        <h1>Welcome to Joplin Sync Server</h1>
        <p class="subtitle">Complete the initial setup by creating your administrator account.</p>

        {{if .Error}}
        <div class="error-message">{{.Error}}</div>
        {{end}}

        <form action="/admin/setup" method="POST">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="admin@example.com">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <button type="submit">Create Administrator Account</button>
        </form>
    </div>
</div>
{{end}}
