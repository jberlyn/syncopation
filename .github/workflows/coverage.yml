name: Badges and Stats

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  badges:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run tests with coverage
        run: |
          go test -coverpkg=./... -coverprofile=coverage.out ./...

      - name: Generate coverage.json and docker_pulls.json
        run: |
          PERCENT=$(go tool cover -func=coverage.out | awk '/total:/ {print $3}' | sed 's/%//')
          echo "Coverage: ${PERCENT}%"
          awk -v pct="$PERCENT" 'BEGIN {
            p = pct + 0;
            if (p >= 90) color = "brightgreen";
            else if (p >= 80) color = "green";
            else if (p >= 70) color = "yellowgreen";
            else if (p >= 60) color = "yellow";
            else if (p >= 50) color = "orange";
            else color = "red";

            printf "{\"schemaVersion\":1,\"label\":\"coverage\",\"message\":\"%.1f%%\",\"color\":\"%s\"}\n", p, color;
          }' > coverage.json

          PULLS=$(curl -sL https://github.com/jberlyn/syncopation/pkgs/container/syncopation | grep -A 2 "Total downloads" | grep "<h3" | sed -E 's/.*title="([^"]+)".*/\1/' || echo "0")
          if [ -z "$PULLS" ]; then PULLS="0"; fi
          echo "Docker pulls: ${PULLS}"
          printf "{\"schemaVersion\":1,\"label\":\"docker pulls\",\"message\":\"%s\",\"color\":\"blue\"}\n" "$PULLS" > docker_pulls.json

      - name: Deploy badge JSONs to badges branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          mkdir -p /tmp/badge
          cp coverage.json /tmp/badge/coverage.json
          cp docker_pulls.json /tmp/badge/docker_pulls.json

          git fetch origin badges || true
          if git rev-parse --verify origin/badges >/dev/null 2>&1; then
            git checkout badges 2>/dev/null || git checkout -b badges origin/badges
            git reset --hard origin/badges
          else
            git checkout --orphan badges
          fi

          git rm -rf . 2>/dev/null || true
          cp /tmp/badge/coverage.json .
          cp /tmp/badge/docker_pulls.json .
          git add coverage.json docker_pulls.json

          if ! git diff --cached --quiet; then
            git commit -m "Update badge stats"
            git push origin badges
          else
            echo "No changes to badge stats."
          fi
